# Weekly update PRs, one grouped PR per ecosystem. CI runs on each of them.
version: 2
updates:
  # The SHA-pinned actions in .github/workflows. Dependabot updates the SHA and the version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  # npm packages from package.json and pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Only propose releases that are at least a week old: most malicious npm releases are caught
    # and unpublished within days.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm-dependencies:
        patterns: ["*"]
